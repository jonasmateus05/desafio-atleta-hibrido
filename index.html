<style>
  :root{
    --bg:#F6F8F2;
    --surface:#FFFFFF;
    --surface-2:#EFF4EA;
    --text:#122018;
    --text-muted:#5B6B60;
    --primary:#1E9E52;
    --primary-dark:#0F7A3D;
    --primary-soft:#E3F5E9;
    --accent:#FF6A3D;
    --accent-soft:#FFE7DC;
    --danger:#E14F45;
    --danger-soft:#FBE4E2;
    --border:#DCE6DA;
    --shadow: 0 1px 2px rgba(18,32,24,.04), 0 8px 24px -12px rgba(18,32,24,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1610;
      --surface:#152019;
      --surface-2:#1B291F;
      --text:#ECF4EE;
      --text-muted:#9FB3A6;
      --primary:#37D97C;
      --primary-dark:#1F9E56;
      --primary-soft:rgba(55,217,124,.14);
      --accent:#FF8A5C;
      --accent-soft:rgba(255,138,92,.14);
      --danger:#FF6B61;
      --danger-soft:rgba(255,107,97,.14);
      --border:#243830;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1610;
    --surface:#152019;
    --surface-2:#1B291F;
    --text:#ECF4EE;
    --text-muted:#9FB3A6;
    --primary:#37D97C;
    --primary-dark:#1F9E56;
    --primary-soft:rgba(55,217,124,.14);
    --accent:#FF8A5C;
    --accent-soft:rgba(255,138,92,.14);
    --danger:#FF6B61;
    --danger-soft:rgba(255,107,97,.14);
    --border:#243830;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100%;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .display{
    font-family:'Bebas Neue',Impact,'Plus Jakarta Sans',sans-serif;
    letter-spacing:.01em;
    line-height:1.02;
  }
  .mono{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  /* topbar */
  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    padding:14px 18px 10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back-btn{
    width:34px;height:34px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:none;
  }
  .back-btn[hidden]{visibility:hidden}
  .progress-track{
    flex:1;height:8px;border-radius:999px;background:var(--surface-2);
    overflow:hidden;border:1px solid var(--border);
  }
  .progress-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--primary-dark),var(--primary));
    width:0%;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .step-count{ font-size:12px; color:var(--text-muted); flex:none; min-width:34px; text-align:right;}

  main{ flex:1; padding:6px 20px 40px; }
  .step{ animation:rise .38s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion: reduce){ .step{animation:none} }

  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--primary-dark); background:var(--primary-soft);
    padding:5px 10px; border-radius:999px; margin-bottom:14px;
  }
  :root:not([data-theme="light"]) .eyebrow, :root[data-theme="dark"] .eyebrow{ color:var(--primary) }
  h1.q{
    font-family:'Bebas Neue',Impact,sans-serif;
    font-size:34px; letter-spacing:.01em; margin:0 0 8px; text-wrap:balance;
  }
  p.sub{ margin:0 0 22px; color:var(--text-muted); font-size:15.5px; line-height:1.5; max-width:46ch;}

  /* options */
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex; align-items:center; gap:14px;
    width:100%; text-align:left;
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:16px; padding:14px 16px;
    cursor:pointer; font:inherit; color:var(--text);
    transition:border-color .15s, background .15s, transform .1s;
    box-shadow:var(--shadow);
  }
  .opt:hover{ border-color:var(--primary); }
  .opt:active{ transform:scale(.98); }
  .opt.selected{ border-color:var(--primary); background:var(--primary-soft); }
  .opt-icon{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:var(--surface-2); display:flex;align-items:center;justify-content:center;
    font-size:20px; overflow:hidden;
  }
  .opt-icon.num{ font-family:'Bebas Neue',sans-serif; font-size:20px; background:var(--primary); color:#fff; }
  .opt-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .opt-text{ flex:1; min-width:0; }
  .opt-label{ display:block; font-weight:700; font-size:15.5px; }
  .opt-sub{ display:block; font-size:13px; color:var(--text-muted); margin-top:2px; }
  .opt-chev{ flex:none; color:var(--text-muted); }

  .sexo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .sexo-card{ background:var(--surface); border:1.5px solid var(--border); border-radius:18px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s, transform .1s; padding:0; font:inherit; color:var(--text); text-align:center; }
  .sexo-card:active{ transform:scale(.98); }
  .sexo-card.selected{ border-color:var(--primary); }
  .sexo-card img{ display:block; width:100%; aspect-ratio:1/1; object-fit:cover; }
  .sexo-card .lbl{ padding:12px; font-weight:800; font-size:15.5px; }

  .corpo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .corpo-card{ background:var(--surface); border:1.5px solid var(--border); border-radius:14px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); padding:0; font:inherit; color:var(--text); text-align:center; transition:border-color .15s, transform .1s; }
  .corpo-card:active{ transform:scale(.97); }
  .corpo-card.selected{ border-color:var(--primary); }
  .corpo-card img{ display:block; width:100%; aspect-ratio:3/5; object-fit:cover; }
  .corpo-card .lbl{ display:block; padding:8px 6px 10px; font-weight:800; font-size:12px; line-height:1.25; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid2 .opt{ flex-direction:column; text-align:center; padding:20px 12px; gap:10px; }
  .grid2 .opt-icon{ width:48px;height:48px; }

  /* silhouettes row */
  .silhouettes{ display:flex; align-items:flex-end; gap:6px; margin-bottom:18px; padding:14px 10px 10px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .silhouettes.photos{ align-items:stretch; padding:10px; }
  .sil-item{ flex:1 1 0; min-width:0; height:76px; display:flex; align-items:flex-end; justify-content:center; }
  .sil-item svg{ height:100%; width:auto; max-width:100%; }
  .sil-item.photo{ height:92px; border-radius:10px; overflow:hidden; }
  .sil-item.photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .grid2 .opt-chev{ display:none; }

  /* CTA */
  .cta{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px 20px; border-radius:14px; border:none;
    background:var(--primary); color:#fff; font-weight:800; font-size:16px;
    cursor:pointer; box-shadow:0 10px 24px -10px color-mix(in srgb, var(--primary) 70%, transparent);
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .cta:active{ transform:scale(.98); }
  .cta.ghost{ background:transparent; color:var(--text-muted); box-shadow:none; font-weight:600; font-size:14px; padding:10px; }

  /* intro hero */
  .hero-photo{ position:relative; border-radius:22px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:20px; }
  .hero-photo img{ display:block; width:100%; height:auto; }
  .hero-photos{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .hero-photos .hero-photo{ margin-bottom:0; aspect-ratio:3/4; }
  .hero-photos .hero-photo img{ width:100%; height:100%; object-fit:cover; }
  /* value stack */
  .stack{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .stack-item{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); }
  .stack-icon{ width:38px;height:38px;border-radius:10px;background:var(--primary-soft); display:flex;align-items:center;justify-content:center; font-size:18px; flex:none;}
  .stack-old{ font-size:12px; color:var(--text-muted); text-decoration:line-through; display:block; }
  .stack-new{ font-size:14px; font-weight:700; display:block; margin-top:1px;}

  /* prova social */
  .proof-card{ border-radius:18px; overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow); background:var(--surface); }
  .proof-card img{ display:block; width:100%; height:auto; }
  .proof-card .cap{ padding:11px 14px 14px; font-size:13px; color:var(--text-muted); text-align:center; }
  .proof-card .cap b{ color:var(--text); }
  .proof-track{ display:flex; overflow-x:auto; gap:16px; scroll-snap-type:x mandatory; margin:0 -20px 6px; padding:2px 20px 14px; }
  .proof-track::-webkit-scrollbar{ height:6px; }
  .proof-track::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
  .proof-slide{ flex:0 0 78%; scroll-snap-align:center; }
  .proof-dots{ display:flex; justify-content:center; gap:6px; margin-bottom:20px; }
  .proof-dots span{ width:6px;height:6px;border-radius:99px; background:var(--border); }
  .proof-dots span.on{ background:var(--primary); width:16px; }

  /* result screen */
  .gauge-wrap{ display:flex; align-items:center; gap:18px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:16px; }
  .gauge{ position:relative; width:96px; height:96px; flex:none; }
  .gauge svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .gauge-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:22px; }
  .gauge-label b{ display:block; font-size:15px; margin-bottom:2px;}
  .gauge-label span{ font-size:13px; color:var(--text-muted); }

  .feature{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow); margin-bottom:10px; }
  .feature .stack-icon{ background:var(--accent-soft); color:var(--accent); }
  .feature b{ display:block; font-size:14.5px; margin-bottom:2px; }
  .feature span{ font-size:13px; color:var(--text-muted); line-height:1.4; }

  .plan-mock{ background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:16px; margin:18px 0; }
  .plan-mock .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .plan-mock .head b{ font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.02em; }
  .plan-mock .tag{ background:var(--primary); color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; text-transform:uppercase; }
  .plan-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px dashed var(--border); font-size:13.5px; }
  .plan-row:first-of-type{ border-top:none; }
  .plan-row .muted{ color:var(--text-muted); font-size:12px; }

  .offer-box{ background:var(--surface); border:2px solid var(--primary); border-radius:18px; padding:20px; text-align:center; box-shadow:var(--shadow); margin:20px 0 12px; }
  .offer-box .from{ font-size:13px; color:var(--text-muted); text-decoration:line-through; }
  .offer-box .to{ font-family:'Bebas Neue',sans-serif; font-size:44px; color:var(--primary-dark); line-height:1; }
  :root:not([data-theme="light"]) .offer-box .to, :root[data-theme="dark"] .offer-box .to{ color:var(--primary); }
  .offer-box .to sup{ font-size:18px; top:-.6em; }
  .offer-box .note{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }

  /* loading (analisando perfil) */
  .loading-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:64vh; gap:20px; padding:0 6px; }
  .loading-spinner{ width:60px; height:60px; border-radius:50%; border:5px solid var(--surface-2); border-top-color:var(--primary); animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .loading-spinner{ animation-duration:2.4s; } }
  .loading-wrap h1.q{ margin:0; text-align:center; }
  .loading-msg{ font-size:14.5px; color:var(--text-muted); min-height:20px; transition:opacity .2s ease; }
  .loading-bar{ width:100%; max-width:240px; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border); }
  .loading-bar-fill{ height:100%; width:6%; background:linear-gradient(90deg,var(--primary-dark),var(--primary)); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1); }

  /* oferta liberada (sem preço) */
  .unlock-box{ background:var(--accent-soft); border:2px dashed var(--accent); border-radius:18px; padding:20px; text-align:center; box-shadow:var(--shadow); margin:20px 0 12px; }
  .unlock-box .badge{ display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:6px 12px; border-radius:999px; margin-bottom:12px; }
  .unlock-box .headline{ font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1.18; letter-spacing:.005em; }
  .unlock-box .note{ font-size:12.5px; color:var(--text-muted); margin-top:8px; }

  .bonus-box{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px 20px 20px; box-shadow:var(--shadow); margin:6px 0 16px; }
  .bonus-box h3{ font-family:'Bebas Neue',sans-serif; font-size:21px; margin:0 0 14px; text-align:center; letter-spacing:.02em; }
  .bonus-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .bonus-list li{ display:flex; align-items:center; gap:12px; font-size:14px; line-height:1.35; }
  .bonus-list .emoji{ font-size:19px; flex:none; width:28px; text-align:center; }

  .icon-row{ display:flex; gap:8px; }
  footer.legal{ text-align:center; font-size:11px; color:var(--text-muted); padding:6px 8px 30px; line-height:1.5; }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="step-count" id="stepCount"></div>
  </div>
  <main id="stepRoot"></main>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // CONFIGURAÇÃO — edite aqui antes de publicar o link definitivo
  // ============================================================
  var CONFIG = {
    marca: "Desafio Atleta Híbrido",
    preco: "19,90",                 // <-- troque pelo valor definido na Cakto
    precoDe: "97,00",               // <-- valor "de" (âncora), opcional
    linkCheckout: "https://pay.cakto.com.br/SEU-LINK-AQUI" // <-- troque pelo link de checkout da Cakto
  };

  var state = { step: 0, answers: {} };

  function icon(name){
    var s = {
      run:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="15" cy="4.5" r="2" fill="currentColor"/><path d="M12 8l3 3 3-1M9 12l3-1 3 4-1 5M9 12l-3 2v4M9 12L7 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      dumbbell:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 9v6M2 10v4M7 6v12M17 6v12M20 10v4M22 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 12h10" stroke="currentColor" stroke-width="1.8"/></svg>',
      fire:'🔥', muscle:'💪', strong:'🏋️', heart:'🫀',
      person:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="7" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      video:'🎥', check:'✅', wpp:'💬', star:'⭐', calendar:'📅', clock:'⏱️'
    };
    return s[name] || '';
  }

  function silhouette(scale, tone){
    // gera um corpo simples cuja largura do tronco varia com "scale"
    var w = 24 + scale*13;
    var cx = 50;
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">' +
      '<circle cx="'+cx+'" cy="18" r="11" fill="'+tone+'"/>' +
      '<path d="M'+(cx-w/2)+' 92 C '+(cx-w/2-4)+' 55, '+(cx-w/2+2)+' 32, '+cx+' 30 C '+(cx+w/2-2)+' 32, '+(cx+w/2+4)+' 55, '+(cx+w/2)+' 92 Z" fill="'+tone+'"/>' +
      '</svg>';
  }

  function optionHTML(o, i){
    var iconHtml = o.img
      ? '<span class="opt-icon"><img src="'+o.img+'" alt="" /></span>'
      : o.num
      ? '<span class="opt-icon num">'+o.num+'</span>'
      : '<span class="opt-icon">'+(o.icon||'')+'</span>';
    return '<button class="opt" data-i="'+i+'" type="button">' +
      iconHtml +
      '<span class="opt-text"><span class="opt-label">'+o.label+'</span>' +
      (o.sub ? '<span class="opt-sub">'+o.sub+'</span>' : '') +
      '</span>' +
      '<span class="opt-chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
    '</button>';
  }

  function bindOptions(root, key, options, opts){
    opts = opts || {};
    var els = root.querySelectorAll('.opt');
    els.forEach(function(el){
      el.addEventListener('click', function(){
        if (el.dataset.locked) return;
        el.dataset.locked = "1";
        el.classList.add('selected');
        var val = options[+el.dataset.i].value;
        state.answers[key] = val;
        setTimeout(function(){ next(); }, opts.delay===0?0:220);
      });
    });
  }

  // ============================================================
  // DEFINIÇÃO DOS PASSOS
  // ============================================================
  var STEPS = [];

  // 0 — Intro
  STEPS.push({
    render: function(){
      return '' +
      '<div class="step">' +
        '<span class="eyebrow">'+icon('fire')+' Desafio de 7 dias</span>' +
        '<h1 class="q display" style="font-size:38px">Torne-se um<br><span style="color:var(--primary-dark)">Atleta Híbrido</span></h1>' +
        '<p class="sub">Descubra o método que une corrida e musculação pra você ter um corpo estético, funcional e natural — sem abrir mão de nenhum dos dois.</p>' +
        '<div class="hero-photos">' +
          '<div class="hero-photo"><img src="img/hero-homem.jpg" alt="Resultado real do Desafio Atleta Híbrido" /></div>' +
          '<div class="hero-photo"><img src="img/hero-mulher.jpg" alt="Resultado real do Desafio Atleta Híbrido" /></div>' +
        '</div>' +
        '<button class="cta" id="startBtn">Começar o desafio '+
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<p class="sub" style="text-align:center;margin:14px 0 0;font-size:12.5px">Leva menos de 1 minuto. Sem compromisso.</p>' +
      '</div>';
    },
    mount: function(root){
      root.querySelector('#startBtn').addEventListener('click', next);
    }
  });

      '</div>';
    },
    mount: function(root){
      var track = root.querySelector('#proofTrack');
      var dots = root.querySelectorAll('#proofDots span');
      track.addEventListener('scroll', function(){
        var idx = Math.round(track.scrollLeft / (track.firstElementChild.offsetWidth + 16));
        dots.forEach(function(d,i){ d.classList.toggle('on', i===idx); });
      }, {passive:true});

      var autoTimer = setInterval(function(){
        if(!document.body.contains(track)){ clearInterval(autoTimer); return; }
        var slideW = track.firstElementChild.offsetWidth + 16;
        var maxScroll = track.scrollWidth - track.clientWidth;
        var nextLeft = track.scrollLeft + slideW;
        if(nextLeft > maxScroll - 10){ nextLeft = 0; }
        track.scrollTo({left:nextLeft, behavior:'smooth'});
      }, 2600);

      track.addEventListener('pointerdown', pauseAuto, {passive:true});

            '<div class="plan-row"><span>Musculação · peitoral e abdômen</span><span class="muted">'+icon('video')+'</span></div>' +
            '<div class="plan-row"><span>Mobilidade e alongamento</span><span class="muted">10 min</span></div>' +
          '</div>' +
          '<p class="sub" style="text-align:center;margin:0 0 6px">Quer receber seu plano de treino personalizado com vídeo-aula de cada exercício + acompanhamento no WhatsApp?</p>' +
          '<div class="unlock-box">' +
            '<span class="badge">🔓 Oferta liberada</span>' +
            '<div class="headline">Acabamos de liberar uma oferta imperdível pra você</div>' +
            '<div class="note">Vagas limitadas para o Desafio de 7 dias · acesso imediato</div>' +
          '</div>' +
          '<button class="cta" id="checkoutBtn">Receber minha oferta agora</button>' +
          '<div class="bonus-box">' +
            '<h3>Bônus</h3>' +
            '<ul class="bonus-list">' +
              '<li><span class="emoji">🏃</span><span>Guia de aquecimento para corrida</span></li>' +
              '<li><span class="emoji">🏋️</span><span>Biblioteca de exercícios da musculação</span></li>' +
              '<li><span class="emoji">📅</span><span>Calendário semanal de treino</span></li>' +
              '<li><span class="emoji">📊</span><span>Planilha de acompanhamento de evolução</span></li>' +
              '<li><span class="emoji">🥗</span><span>Guia básico de alimentação para acompanhar os treinos</span></li>' +
              '<li><span class="emoji">🔥</span><span>Desafio de 30 dias para criar consistência</span></li>' +
            '</ul>' +
          '</div>' +
          '<button class="cta" id="checkoutBtn2">Receber minha oferta agora</button>' +
        '</div>' +
      '</div>';
    },
    mount: function(root){
      var loadingView = root.querySelector('#loadingView');
      var resultView = root.querySelector('#resultView');
      var msgEl = root.querySelector('#loadingMsg');
      var fill = root.querySelector('#loadingFill');

      function startGauge(){
        var ring = root.querySelector('#gaugeRing');
        var num = root.querySelector('#gaugeNum');
        var target = 97, circumference = 264;
        var start = null, duration = 900;
        function frame(ts){
          if(!start) start = ts;
          var p = Math.min(1, (ts-start)/duration);
          var val = Math.round(target*p);
          num.textContent = val + '%';
          ring.setAttribute('stroke-dashoffset', circumference - (circumference*val/100));
          if(p<1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      var messages = [
        'Cruzando suas respostas com nosso banco de dados',
        'Calculando compatibilidade com seu objetivo',
        'Liberando sua oferta exclusiva...'
      ];

      var msgTimer = setInterval(function(){
        step++;
        if(step < messages.length){
          msgEl.style.opacity = '0';
          setTimeout(function(){
            msgEl.textContent = messages[step];
            msgEl.style.opacity = '1';
          }, 180);
          fill.style.width = (15 + step*40) + '%';
        }
      }, 700);

      setTimeout(function(){
        clearInterval(msgTimer);
        fill.style.width = '100%';
        setTimeout(function(){
          loadingView.style.display = 'none';
          resultView.style.display = 'block';
          startGauge();
        }, 250);
      }, 2300);

        if (typeof fbq === 'function') { fbq('track', 'InitiateCheckout'); }

      }
      root.querySelector('#checkoutBtn').addEventListener('click', goCheckout);
      root.querySelector('#checkoutBtn2').addEventListener('click', goCheckout);
    }
  });

    var pct = Math.round((state.step / (STEPS.length-1)) * 100);

    count.textContent = state.step===0 ? '' : state.step + '/' + (STEPS.length-1);
    window.scrollTo({top:0, behavior:'auto'});
  }
  function next(){ if (state.step < STEPS.length-1){ state.step++; render(); } }

  render();
})();
